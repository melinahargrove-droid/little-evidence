name: Verify Little Evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts
      - name: Run synthetic regression checks
        run: |
          for script in scripts/verify-*; do
            node "$script"
          done
      - name: Check inline JavaScript syntax
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          for (const match of html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)) {
            if (match[1].trim()) new vm.Script(match[1]);
          }
          console.log('PASS: inline JavaScript syntax');
          JS
